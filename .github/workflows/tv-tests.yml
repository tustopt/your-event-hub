name: TV Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  television:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install 2>&1 | tee install.log
      - name: Typecheck ingestion
        id: typecheck
        continue-on-error: true
        run: npm run typecheck:ingestion 2>&1 | tee typecheck.log
      - name: Run television unit tests
        id: tests
        continue-on-error: true
        run: npx vitest run ingestion/sources/rtp/fetcher.test.ts ingestion/sources/television/types.test.ts ingestion/sources/television/normalizer.test.ts ingestion/sources/television/channels.test.ts ingestion/sources/television/parser.test.ts ingestion/sources/sic/fetcher.test.ts ingestion/sources/tvi/fetcher.test.ts ingestion/sources/television/time.test.ts ingestion/sources/television/production-contract.test.ts ingestion/core/production-adapters.test.ts 2>&1 | tee vitest.log
      - name: Upload TV test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-test-diagnostics
          path: |
            install.log
            typecheck.log
            vitest.log
          if-no-files-found: ignore
      - name: Fail if deterministic TV checks failed
        if: steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1

  live-validation:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: television
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run live SIC and TVI diagnostics
        run: npx tsx ingestion/runners/tv-live-diagnostic.ts
