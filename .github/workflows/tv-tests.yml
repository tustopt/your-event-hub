name: TV Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
    paths-ignore:
      - ".github/diagnostics/**"
      - ".github/workflows/tv-stage-diagnostics.yml"
      - ".github/workflows/tv-diagnostics.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  television:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies diagnostic
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --verbose 2>&1 | tee /tmp/npm-install.log
      - name: Persist npm diagnostic
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .github/diagnostics
          {
            echo "commit=${{ github.sha }}"
            echo "date=$(date -u +%FT%TZ)"
            echo
            cat /tmp/npm-install.log
            echo
            echo "===== npm debug logs ====="
            for f in /home/runner/.npm/_logs/*.log; do
              echo "--- $f ---"
              cat "$f"
            done
          } > .github/diagnostics/npm-install.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/npm-install.txt
          git commit -m "ci(tv): capture npm install diagnostic"
          git push
      - name: Fail deterministic workflow
        if: steps.install.outcome == 'failure'
        run: exit 1
