name: TV Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  television:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies diagnostic
        run: npm install --ignore-scripts
