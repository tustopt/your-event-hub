name: TV Ingestion Diagnostics

on:
  push:
    branches:
      - "fix/rtp-production-channels"

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck ingestion
        id: typecheck
        continue-on-error: true
        run: npm run typecheck:ingestion 2>&1 | tee /tmp/typecheck.log

      - name: Run TV tests
        id: tests
        continue-on-error: true
        run: npx vitest run ingestion/sources/rtp/fetcher.test.ts ingestion/sources/television/types.test.ts ingestion/sources/television/normalizer.test.ts ingestion/sources/television/channels.test.ts ingestion/sources/television/parser.test.ts ingestion/sources/sic/fetcher.test.ts ingestion/sources/tvi/fetcher.test.ts ingestion/sources/television/time.test.ts ingestion/sources/television/production-contract.test.ts ingestion/core/production-adapters.test.ts 2>&1 | tee /tmp/vitest.log

      - name: Write summary
        if: always()
        run: |
          {
            echo "INSTALL_EXIT=${{ steps.install.outcome }}"
            echo "TYPECHECK_EXIT=${{ steps.typecheck.outcome }}"
            echo "TESTS_EXIT=${{ steps.tests.outcome }}"
            echo
            echo "===== npm install ====="
            cat /tmp/npm-install.log 2>/dev/null || true
            echo
            echo "===== typecheck ====="
            cat /tmp/typecheck.log 2>/dev/null || true
            echo
            echo "===== vitest ====="
            cat /tmp/vitest.log 2>/dev/null || true
          } > tv-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-ingestion-diagnostics
          path: tv-diagnostics.txt
          if-no-files-found: error
