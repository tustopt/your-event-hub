name: Production Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional source key (currently cinemateca_pt)"
        required: false
        type: string
      limit:
        description: "Optional maximum number of source items"
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Europe/Lisbon"

concurrency:
  group: production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOCUEVENTS_APP_URL: ${{ secrets.DOCUEVENTS_APP_URL }}
      DOCUEVENTS_INGEST_AUTOMATION_TOKEN: ${{ secrets.DOCUEVENTS_INGEST_AUTOMATION_TOKEN }}
      INGEST_SOURCE: ${{ inputs.source }}
      INGEST_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run production ingestion
        run: npx tsx ingestion/runners/production-ingestion-cli.ts
