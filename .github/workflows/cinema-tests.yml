name: Cinema and Festival Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  cinema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck ingestion
        run: npm run typecheck:ingestion
      - name: Run cinema and festival tests
        run: npx vitest run ingestion/sources/cinemateca_pt ingestion/sources/cinema_sao_jorge ingestion/sources/cinema_fernando_lopes ingestion/sources/doclisboa ingestion/core/production-adapters.test.ts ingestion/core/source-fetchers.test.ts ingestion/core/source-pipeline.test.ts ingestion/core/source-registry.test.ts
      - name: Run live cinema diagnostic
        continue-on-error: true
        run: npm run ingest:cinema:diagnostic
