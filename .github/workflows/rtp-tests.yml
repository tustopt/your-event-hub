name: RTP Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  rtp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck ingestion
        run: npm run typecheck:ingestion
      - name: Run television ingestion tests
        run: npx vitest run ingestion/sources/rtp/fetcher.test.ts ingestion/sources/television/types.test.ts ingestion/sources/television/normalizer.test.ts ingestion/sources/television/channels.test.ts ingestion/sources/television/parser.test.ts ingestion/sources/television/time.test.ts ingestion/sources/television/production-contract.test.ts ingestion/core/production-adapters.test.ts ingestion/core/source-fetchers.test.ts ingestion/core/source-pipeline.test.ts ingestion/core/source-registry.test.ts
