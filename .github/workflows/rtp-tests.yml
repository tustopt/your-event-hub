name: RTP Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  rtp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Diagnose RTP EPG collection
        run: |
          npx tsx -e 'import { fetchRtpEpgProgrammeItems, fetchRtpProgramme, isRtpDocumentaryPage } from "./ingestion/sources/rtp/fetcher.ts"; (async () => { const items = await fetchRtpEpgProgrammeItems(); const futureItems = await fetchRtpEpgProgrammeItems({ now: () => new Date("2026-09-23T12:00:00Z") }); const match = futureItems.find((item) => /repovoadores/i.test(item.title)); const response = match ? await fetch(match.sourceUrl) : undefined; const html = response ? await response.text() : ""; const future = await fetchRtpProgramme({ now: () => new Date("2026-09-23T12:00:00Z"), limit: 5 }); console.log(JSON.stringify({ count: items.length, futureCount: futureItems.length, futureMatch: match ? { title: match.title, channel: match.channel, sourceUrl: match.sourceUrl, status: response?.status, documentary: isRtpDocumentaryPage(html), htmlLength: html.length, marker: html.toLowerCase().includes("document") } : null, futureDocumentaries: future.map((item) => ({ title: item.title, channel: item.channel, sourceUrl: item.sourceUrl })) }, null, 2)); })();'
      - name: Run television ingestion tests
        run: npx vitest run ingestion/sources/rtp/fetcher.test.ts ingestion/sources/television/types.test.ts ingestion/sources/television/normalizer.test.ts ingestion/sources/television/channels.test.ts ingestion/sources/television/parser.test.ts

      - name: Run controlled RTP live ingestion
        env:
          DOCUEVENTS_APP_URL: ${{ secrets.DOCUEVENTS_APP_URL }}
          DOCUEVENTS_INGEST_AUTOMATION_TOKEN: ${{ secrets.DOCUEVENTS_INGEST_AUTOMATION_TOKEN }}
          INGEST_SOURCE: rtp
          INGEST_LIMIT: "5"
        run: npx tsx ingestion/runners/production-ingestion-cli.ts
