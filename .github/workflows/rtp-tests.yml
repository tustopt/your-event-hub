name: RTP Ingestion Tests

on:
  push:
    branches:
      - "fix/rtp-production-channels"
  pull_request:
    branches:
      - main

jobs:
  rtp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Diagnose RTP EPG collection
        run: |
          npx tsx -e 'import { fetchRtpEpgProgrammeItems } from "./ingestion/sources/rtp/fetcher.ts"; (async () => { const items = await fetchRtpEpgProgrammeItems(); console.log(JSON.stringify({ count: items.length, channels: [...new Set(items.map((item) => item.channel))], documentaryCandidates: items.filter((item) => /repovoadores|document/i.test(item.title)).slice(0, 10).map((item) => ({ title: item.title, channel: item.channel, sourceUrl: item.sourceUrl })) }, null, 2)); })();'
      - name: Run television ingestion tests
        run: npx vitest run ingestion/sources/rtp/fetcher.test.ts ingestion/sources/television/types.test.ts ingestion/sources/television/normalizer.test.ts ingestion/sources/television/channels.test.ts ingestion/sources/television/parser.test.ts

      - name: Run controlled RTP live ingestion
        env:
          DOCUEVENTS_APP_URL: ${{ secrets.DOCUEVENTS_APP_URL }}
          DOCUEVENTS_INGEST_AUTOMATION_TOKEN: ${{ secrets.DOCUEVENTS_INGEST_AUTOMATION_TOKEN }}
          INGEST_SOURCE: rtp
          INGEST_LIMIT: "5"
        run: npx tsx ingestion/runners/production-ingestion-cli.ts
