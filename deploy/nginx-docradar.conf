    # BEGIN docradar-app
    location = /docradar { return 301 /docradar/; }
    location ^~ /docradar/assets/ {
        proxy_pass http://127.0.0.1:13003/assets/;
        proxy_set_header Host $host;
    }
    location = /docradar/favicon.ico {
        proxy_pass http://127.0.0.1:13003/favicon.ico;
        proxy_set_header Host $host;
    }
    location ^~ /docradar/ {
        proxy_pass http://127.0.0.1:13003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
    # END docradar-app
